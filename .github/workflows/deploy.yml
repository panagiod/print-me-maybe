name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hetzner over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            git config --system --add safe.directory /opt/eshop
            # The deploy.sh on disk is still the previous revision until git reset.
            # Copy listing photos into DATA_DIR first so this pull can delete them from git.
            mkdir -p /var/lib/eshop/seed-product-images
            if [ -d /opt/eshop/static/images/products ]; then
              find /opt/eshop/static/images/products -maxdepth 1 -type f ! -name 'placeholder.svg' \
                -exec cp -n {} /var/lib/eshop/seed-product-images/ \; || true
            fi
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y libpango-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info fonts-dejavu-core
            bash /opt/eshop/deploy/deploy.sh
