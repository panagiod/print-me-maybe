{% extends "base.html" %}

{% block title %}Studio login — {{ shop_name }}{% endblock %}

{% block content %}
<h1 class="page-title">Studio login</h1>
<p class="hero-subtitle">Orders and stock for Print Me Maybe.</p>

{% if error %}
<div class="alert alert-error" role="alert">{{ error }}</div>
{% endif %}

<form action="/admin/login" method="post" class="checkout-form admin-login-form">
  <label>
    Admin password
    <input type="password" name="password" required autocomplete="current-password">
  </label>
  <button type="submit" class="btn btn-primary">Log in</button>
</form>
{% endblock %}
